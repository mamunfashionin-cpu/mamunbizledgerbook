<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mamun Fashion BizLedger Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --bg:#0A0F1C;
    --bg-elev:#0D1424;
    --card:#141D30;
    --card-2:#1A2438;
    --card-hover:#1E2A42;
    --border:#242E45;
    --border-soft:#1C2538;
    --text:#F2F5FA;
    --text-dim:#8B94AC;
    --text-faint:#5B6480;
    --blue:#5B8DFF;
    --blue-dim:#3A5CC4;
    --blue-tint:#1B2A4D;
    --green:#2FD675;
    --green-tint:#123321;
    --red:#FF5C5C;
    --red-tint:#3A1620;
    --amber:#FFB547;
    --lavender:#C7D2FE;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --font-display:'Poppins', sans-serif;
    --font-body:'Manrope', sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Safety net: any inline <svg> icon without an explicit inline size (or a more
     specific rule, e.g. .nav-item svg) defaults to this size instead of the
     browser's oversized intrinsic default for unsized replaced SVGs. */
  svg{ width:20px; height:20px; flex-shrink:0; display:block; }
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1200px 800px at 50% -10%, #0F1830 0%, var(--bg) 55%);
    color:var(--text);
    font-family:var(--font-body);
    overflow:hidden;
  }
  #app{
    width:100%;
    max-width:480px;
    margin:0 auto;
    height:100vh;
    height:100dvh;
    position:relative;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    box-shadow:0 0 60px rgba(0,0,0,0.5);
    transition:max-width .15s ease;
  }
  /* ---------- Responsive breakpoints: tablet & desktop ---------- */
  @media (min-width:700px){
    body{ padding:24px 0; }
    #app{
      max-width:640px;
      height:calc(100vh - 48px);
      height:calc(100dvh - 48px);
      border-radius:28px;
      overflow:hidden;
      box-shadow:0 40px 100px rgba(0,0,0,0.65), 0 0 0 1px var(--border-soft);
    }
    .stat-grid{grid-template-columns:repeat(4,1fr);}
    .ledger-scroll{flex-wrap:wrap; overflow-x:visible;}
    .ledger-card{min-width:0; flex:1 1 160px;}
    .chip-grid{grid-template-columns:repeat(5,1fr);}
  }
  @media (min-width:1024px){
    body{ padding:36px 0; }
    #app{
      max-width:920px;
      height:calc(100vh - 72px);
      height:calc(100dvh - 72px);
    }
    .screen{ padding-left:8px; padding-right:8px; }
    .stat-grid{grid-template-columns:repeat(4,1fr); gap:16px;}
    .row-list{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
    .row-list .txn-row{ margin-bottom:12px; }
    .bottom-nav{ padding-left:24px; padding-right:24px; }
    .fab{ left:24px; right:24px; }
    .topbar{ padding-left:24px; padding-right:24px; }
  }
  @media (min-width:1024px) and (max-width:1279px){
    #app{max-width:840px;}
  }
  ::-webkit-scrollbar{width:0;height:0;}
  .screen{flex:1;overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:110px;}
  .hidden{display:none !important;}

  /* ---------- Top bar ---------- */
  .topbar{
    padding:18px 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, #101a30 0%, rgba(16,26,48,0) 100%);
    position:sticky; top:0; z-index:5;
  }
  .biz-switch{display:flex; align-items:center; gap:12px; cursor:pointer; min-width:0;}
  .biz-icon{
    width:44px;height:44px;border-radius:13px;
    background:linear-gradient(135deg, var(--blue), #7AA6FF);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-weight:700; font-size:17px; color:#0A1330;
    flex-shrink:0;
  }
  .biz-name-wrap{min-width:0;}
  .biz-name{font-family:var(--font-display); font-weight:600; font-size:18px; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .biz-sub{font-size:12.5px; color:var(--text-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;
    background:var(--card-2); border:1px solid var(--border-soft);
    display:flex;align-items:center;justify-content:center;
    color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .icon-btn:active{background:var(--card-hover);}

  h1,h2,h3{font-family:var(--font-display); margin:0;}
  .section-title{font-size:15px; font-weight:700; margin:22px 18px 12px; display:flex; align-items:center; justify-content:space-between;}
  .link-btn{color:var(--blue); font-size:13.5px; font-weight:600; cursor:pointer; background:none; border:none; font-family:var(--font-body);}

  /* ---------- Cards / grid ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 18px 0;}
  .stat-card{
    background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
    padding:16px; min-height:110px; display:flex; flex-direction:column; justify-content:space-between;
    cursor:pointer;
  }
  .stat-card.accent{background:linear-gradient(135deg, var(--lavender), #A9B8F5); color:#131A33;}
  .stat-ico{width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center; margin-bottom:8px;}
  .stat-label{font-size:12.5px; color:var(--text-dim); font-weight:600;}
  .stat-card.accent .stat-label{color:#3A4270;}
  .stat-value{font-size:20px; font-weight:800; font-family:var(--font-display); margin-top:2px;}

  .wide-card{
    margin:14px 18px 0; background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-lg);
    padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer;
  }
  .wide-card .ico-circle{width:42px;height:42px;border-radius:50%; background:var(--blue-tint); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .wide-card .txt{flex:1; min-width:0;}
  .wide-card .txt .t1{font-weight:700; font-size:15px;}
  .wide-card .txt .t2{font-size:12.5px; color:var(--text-dim); margin-top:1px;}

  .row-list{margin:0 18px;}
  .txn-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    margin-bottom:10px; cursor:pointer;
  }
  .txn-row:active{background:var(--card-hover);}
  .txn-dot{width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .txn-dot.in{background:var(--green-tint); color:var(--green);}
  .txn-dot.out{background:var(--red-tint); color:var(--red);}
  .txn-info{flex:1; min-width:0;}
  .txn-name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn-meta{font-size:12px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .txn-amt{text-align:right; flex-shrink:0;}
  .txn-amt .amt{font-weight:800; font-size:15px; font-family:var(--font-display);}
  .txn-amt .amt.in{color:var(--green);}
  .txn-amt .amt.out{color:var(--red);}
  .txn-amt .lbl{font-size:11px; color:var(--text-dim); margin-top:1px;}

  .empty-state{text-align:center; padding:50px 30px; color:var(--text-dim);}
  .empty-state .em-ico{font-size:40px; margin-bottom:12px;}
  .empty-state .em-t{font-weight:700; color:var(--text); font-size:15.5px; margin-bottom:6px;}
  .empty-state .em-s{font-size:13px; line-height:1.5;}

  /* Ledger chips (cashbooks) */
  .ledger-scroll{display:flex; gap:12px; overflow-x:auto; padding:2px 18px 6px; margin-top:6px;}
  .ledger-card{
    min-width:150px; background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md);
    padding:14px; cursor:pointer; flex-shrink:0;
  }
  .ledger-card .lc-top{display:flex; align-items:center; gap:8px; margin-bottom:10px;}
  .ledger-card .lc-ico{width:30px;height:30px;border-radius:9px; background:var(--blue-tint); color:var(--blue-soft,var(--blue)); display:flex;align-items:center;justify-content:center; font-size:15px;}
  .ledger-card .lc-name{font-weight:700; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100px;}
  .ledger-card .lc-bal{font-family:var(--font-display); font-weight:800; font-size:16px;}
  .ledger-card .lc-sub{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .add-ledger-card{
    min-width:110px; border:1.5px dashed var(--border); border-radius:var(--radius-md);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; flex-shrink:0;
  }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0;
    background:rgba(13,20,36,0.94); backdrop-filter:blur(14px);
    border-top:1px solid var(--border-soft);
    display:flex; padding:8px 6px calc(8px + var(--safe-bottom));
    z-index:20;
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 0; cursor:pointer; color:var(--text-faint); font-size:11px; font-weight:600;
  }
  .nav-item.active{color:var(--blue);}
  .nav-item svg{width:22px;height:22px;}

  .fab{
    position:absolute; left:18px; right:18px; bottom:78px;
    background:linear-gradient(135deg, var(--blue), #7AA6FF);
    color:#0A1330; border:none; border-radius:16px;
    padding:16px; font-family:var(--font-display); font-weight:700; font-size:15px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 10px 30px rgba(91,141,255,0.35); cursor:pointer; z-index:15;
  }
  .fab:active{transform:scale(0.98);}

  /* ---------- Modal / sheet ---------- */
  .overlay{
    position:absolute; inset:0; background:rgba(4,7,15,0.7); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay.center{align-items:center; padding:20px;}
  .sheet{
    width:100%; background:var(--bg-elev);
    border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto;
    animation:slideUp .22s ease-out; border:1px solid var(--border-soft); border-bottom:none;
  }
  .overlay.center .sheet{border-radius:20px; border-bottom:1px solid var(--border-soft); max-height:85vh; max-width:420px;}
  @media (min-width:700px){
    .overlay{ align-items:center; }
    .sheet{ max-width:460px; border-radius:20px; border-bottom:1px solid var(--border-soft); margin-bottom:0; }
    .sheet-body .chip-grid{ grid-template-columns:repeat(3,1fr); }
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0.5;} to{transform:translateY(0); opacity:1;}}
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 14px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--bg-elev); z-index:2;
  }
  .sheet-title{font-family:var(--font-display); font-weight:700; font-size:17px;}
  .sheet-body{padding:18px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-dim); margin-bottom:7px;}
  .field input[type=text], .field input[type=number], .field input[type=tel], .field input[type=email], .field input[type=date], .field input[type=time], .field input[type=password], .field select, .field textarea{
    width:100%; background:var(--card); border:1px solid var(--border); color:var(--text);
    border-radius:var(--radius-sm); padding:13px 14px; font-size:14.5px; font-family:var(--font-body); outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);}
  .field textarea{resize:vertical; min-height:60px;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1;}
  .amount-input{display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:13px 14px;}
  .amount-input .cur{color:var(--blue); font-weight:700; font-size:18px;}
  .amount-input input{border:none; background:none; padding:0; font-size:22px; font-weight:800; font-family:var(--font-display); color:var(--text); width:100%;}
  .amount-input input:focus{outline:none;}

  .seg{display:flex; background:var(--card); border-radius:var(--radius-sm); padding:4px; gap:4px; margin-bottom:18px;}
  .seg button{flex:1; border:none; background:none; padding:12px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; color:var(--text-dim); font-family:var(--font-body); display:flex; align-items:center; justify-content:center; gap:6px;}
  .seg button.active.in{background:var(--green); color:#082614;}
  .seg button.active.out{background:var(--red); color:#360A0A;}

  .chip-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .chip{background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 6px; text-align:center; font-size:12.5px; font-weight:700; cursor:pointer;}
  .chip.active{background:var(--blue); color:#0A1330; border-color:var(--blue);}
  .chip .ci{font-size:17px; display:block; margin-bottom:4px;}

  .btn{
    width:100%; padding:15px; border-radius:var(--radius-sm); border:none; font-family:var(--font-display);
    font-weight:700; font-size:15px; cursor:pointer; text-align:center;
  }
  .btn-primary{background:var(--blue); color:#0A1330;}
  .btn-outline{background:none; border:1.5px solid var(--border); color:var(--text);}
  .btn-danger{background:var(--red-tint); color:var(--red); border:1.5px solid rgba(255,92,92,0.3);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}
  .btn-row .btn{flex:1;}

  select{appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238B94AC' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center;}

  .party-avatar{width:44px;height:44px;border-radius:50%; background:var(--blue-tint); color:var(--blue); display:flex;align-items:center;justify-content:center; font-weight:700; font-size:14.5px; flex-shrink:0;}
  .tag{display:inline-block; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:6px; text-transform:uppercase; letter-spacing:.3px;}
  .tag.customer{background:var(--blue-tint); color:var(--blue-soft, #9DB8FF);}
  .tag.supplier{background:#3A2A55; color:#D0AFFF;}
  .tag.contractor{background:#2A3A20; color:#B7E58A;}

  .search-bar{margin:4px 18px 14px; display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px 14px;}
  .search-bar input{flex:1; background:none; border:none; color:var(--text); font-size:14px; font-family:var(--font-body);}
  .search-bar input:focus{outline:none;}

  .tab-pills{display:flex; gap:8px; margin:0 18px 14px; overflow-x:auto;}
  .pill{padding:9px 15px; border-radius:20px; background:var(--card); border:1px solid var(--border-soft); font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .pill.active{background:var(--blue); color:#0A1330; border-color:var(--blue);}

  .kv-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border-soft); font-size:13.5px;}
  .kv-row:last-child{border-bottom:none;}
  .kv-row .k{color:var(--text-dim);}
  .kv-row .v{font-weight:700;}

  .business-list-item{
    display:flex; align-items:center; gap:12px; padding:14px; background:var(--card);
    border:1px solid var(--border-soft); border-radius:var(--radius-md); margin-bottom:10px; cursor:pointer;
  }
  .business-list-item.active-biz{border-color:var(--blue);}
  .badge-active{background:var(--blue); color:#0A1330; font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px; margin-left:8px;}

  .settings-group{margin:0 18px 22px;}
  .settings-item{
    display:flex; align-items:center; gap:14px; padding:14px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer;
  }
  .settings-item:last-child{border-bottom:none;}
  .settings-item .si-ico{width:36px;height:36px;border-radius:10px; background:var(--card-2); display:flex;align-items:center;justify-content:center; flex-shrink:0;}
  .settings-item .si-txt{flex:1;}
  .settings-item .si-t1{font-weight:700; font-size:14px;}
  .settings-item .si-t2{font-size:12px; color:var(--text-dim); margin-top:1px;}
  .toggle{width:44px;height:26px;border-radius:14px;background:var(--card-2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
  .toggle.on{background:var(--blue); border-color:var(--blue);}
  .toggle .knob{width:20px;height:20px;border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:left .15s;}
  .toggle.on .knob{left:20px;}

  .toast{
    position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
    background:#1C2740; color:var(--text); padding:11px 20px; border-radius:30px; font-size:13px; font-weight:600;
    box-shadow:0 8px 24px rgba(0,0,0,0.4); z-index:100; border:1px solid var(--border); white-space:nowrap;
  }
  .lock-screen{position:absolute; inset:0; background:var(--bg); z-index:200; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; text-align:center;}
  .pin-dots{display:flex; gap:14px; margin:22px 0;}
  .pin-dots .d{width:14px;height:14px;border-radius:50%; border:1.5px solid var(--border);}
  .pin-dots .d.filled{background:var(--blue); border-color:var(--blue);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; width:100%; max-width:280px;}
  .keypad button{padding:18px; border-radius:50%; background:var(--card); border:1px solid var(--border-soft); color:var(--text); font-size:20px; font-weight:700; cursor:pointer;}
  .keypad button:active{background:var(--card-hover);}

  .loader-wrap{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; z-index:999;}
  .spinner{width:36px;height:36px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .swipe-actions{display:flex; gap:8px; margin-top:2px;}
  .icon-mini{width:32px;height:32px;border-radius:8px; background:var(--card-2); display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--text-dim); flex-shrink:0;}
  .icon-mini.danger:active{background:var(--red-tint); color:var(--red);}
  .icon-mini:active{background:var(--card-hover);}
</style>
</head>
<body>

<div class="loader-wrap" id="loader">
  <div class="spinner"></div>
  <div style="font-family:var(--font-display); font-weight:600; color:var(--text-dim); font-size:13.5px;">Loading BizLedger…</div>
</div>

<div id="app" class="hidden"></div>

<script>
/* ============================= STATE ============================= */
let DB = null;
const STORAGE_KEY = 'bizledger-data-v1';
let UI = {
  tab:'home',
  ledgerFilter:'all',      // active ledger id in Ledger tab, or 'all'
  partyQuery:'',
  partyFilter:'all',       // all | customer | supplier | contractor
  reportBizId:null,        // null = all businesses... but spec: per business separate. default = active
  reportLedgerId:'all',
  reportFrom:'', reportTo:'',
  txnDraft:null,           // when editing
};

function uid(p){ return (p||'id') + '_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTimeStr(){ const d=new Date(); let h=d.getHours(), m=d.getMinutes(); const ap = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12; return `${h}:${String(m).padStart(2,'0')} ${ap}`; }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short', day:'numeric', year:'numeric'}); }
function initials(name){ return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function curSym(){ return (DB.settings && DB.settings.currency) || '₹'; }
function fmtAmt(n){ n = Number(n)||0; return curSym() + n.toLocaleString('en-IN', {maximumFractionDigits:0}); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= STORAGE ============================= */
async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      DB = JSON.parse(res.value);
      // migrate/defaults
      if(!DB.partyTxns) DB.partyTxns = [];
      if(!DB.settings) DB.settings = { currency:'₹', pinLock:false, pin:'' };
      if(!DB.settings.currency) DB.settings.currency = '₹';
    } else {
      DB = seedData();
      await persist();
    }
  }catch(e){
    DB = seedData();
    try{ await persist(); }catch(e2){}
  }
}
let saveTimer = null;
async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(DB), false);
  }catch(e){ console.error('save failed', e); showToast('⚠️ Could not save — changes may be lost'); }
}
function save(){ persist(); }

/* ============================= DERIVED HELPERS ============================= */
function activeBusiness(){ return DB.businesses.find(b=>b.id===DB.activeBusinessId) || DB.businesses[0]; }
function bizLedgers(bizId){ return DB.ledgers.filter(l=>l.businessId===bizId); }
function bizTxns(bizId){ return DB.transactions.filter(t=>t.businessId===bizId); }
function bizParties(bizId){ return DB.parties.filter(p=>p.businessId===bizId); }
function ledgerTxns(ledgerId){ return DB.transactions.filter(t=>t.ledgerId===ledgerId); }
function ledgerBalance(ledgerId){
  return ledgerTxns(ledgerId).reduce((s,t)=> s + (t.type==='in'?t.amount:-t.amount), 0);
}
function bizTotals(bizId){
  const txns = bizTxns(bizId);
  const cashIn = txns.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const cashOut = txns.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  return { cashIn, cashOut, net: cashIn-cashOut };
}
function partyBalance(partyId){
  const txns = DB.partyTxns.filter(p=>p.partyId===partyId);
  return txns.reduce((s,t)=> s + (t.type==='you_gave'? t.amount : -t.amount), 0);
}
function partyLastEntryDate(partyId){
  const txns = DB.partyTxns.filter(p=>p.partyId===partyId).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
  return txns[0] ? txns[0].date : null;
}
function ledgerById(id){ return DB.ledgers.find(l=>l.id===id); }
function partyById(id){ return DB.parties.find(p=>p.id===id); }

  if(UI.partyFilter!=='all') parties = parties.filter(p=>p.type===UI.partyFilter);
  if(UI.partyQuery.trim()) parties = parties.filter(p=>p.name.toLowerCase().includes(UI.partyQuery.trim().toLowerCase()));

}

function renderPartiesOnly(){

/* ============================= REPORTS TAB ============================= */
function renderReportsTab(){
  const biz = activeBusiness();
  const ledgers = bizLedgers(biz.id);
  UI.reportLedgerId = UI.reportLedgerId || 'all';
  let txns = bizTxns(biz.id);
  if(UI.reportLedgerId!=='all') txns = txns.filter(t=>t.ledgerId===UI.reportLedgerId);
  if(UI.reportFrom) txns = txns.filter(t=> t.date >= UI.reportFrom);
  if(UI.reportTo) txns = txns.filter(t=> t.date <= UI.reportTo);

  const cashIn = txns.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
  const cashOut = txns.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
  const net = cashIn-cashOut;

  // category breakdown
  const catMap = {};
  txns.forEach(t=>{ const k=t.category||'Other'; catMap[k]=catMap[k]||{in:0,out:0}; catMap[k][t.type]+=t.amount; });
  const cats = Object.entries(catMap).sort((a,b)=> (b[1].in+b[1].out)-(a[1].in+a[1].out));

  // ledger breakdown
  const ledgerRows = ledgers.map(l=>{
    const lt = txns.filter(t=>t.ledgerId===l.id);
    const li = lt.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
    const lo = lt.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);
    return {l, li, lo, net:li-lo};
  });

  return `
    <div class="section-title" style="margin-top:16px;">Filters</div>
    <div style="padding:0 18px;">
      <div class="field-row">
        <div class="field">
          <label>Ledger</label>
          <select onchange="UI.reportLedgerId=this.value; render();">
            <option value="all" ${UI.reportLedgerId==='all'?'selected':''}>All Ledgers</option>
            ${ledgers.map(l=>`<option value="${l.id}" ${UI.reportLedgerId===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>From</label><input type="date" value="${UI.reportFrom}" onchange="UI.reportFrom=this.value; render();"></div>
        <div class="field"><label>To</label><input type="date" value="${UI.reportTo}" onchange="UI.reportTo=this.value; render();"></div>
      </div>
    </div>

    <div class="section-title">Summary <span class="link-btn" style="visibility:hidden;">.</span></div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">Total Cash-In</div><div class="stat-value" style="color:var(--green)">${fmtAmt(cashIn)}</div></div>
      <div class="stat-card"><div class="stat-label">Total Cash-Out</div><div class="stat-value" style="color:var(--red)">${fmtAmt(cashOut)}</div></div>
    </div>
    <div class="wide-card" style="background:linear-gradient(135deg, var(--lavender), #A9B8F5); border:none; cursor:default;">
      <div style="flex:1;">
        <div style="font-size:11.5px; font-weight:800; letter-spacing:.4px; color:#3A4270;">NET PROFIT / BALANCE</div>
        <div style="font-family:var(--font-display); font-weight:800; font-size:24px; color:#131A33;">${fmtAmt(net)}</div>
      </div>
    </div>

    <div class="section-title">By Ledger</div>
    <div class="row-list">
      ${ledgerRows.map(r=>`
        <div class="txn-row" style="cursor:default;">
          <div class="txn-dot in" style="background:var(--blue-tint); color:var(--blue-soft,#9DB8FF);">${r.l.icon||'📒'}</div>
          <div class="txn-info"><div class="txn-name">${escapeHtml(r.l.name)}</div><div class="txn-meta">In ${fmtAmt(r.li)} · Out ${fmtAmt(r.lo)}</div></div>
          <div class="txn-amt"><div class="amt ${r.net>=0?'in':'out'}">${fmtAmt(Math.abs(r.net))}</div><div class="lbl">${r.net>=0?'Positive':'Negative'}</div></div>
        </div>`).join('') || `<div class="empty-state"><div class="em-s">No ledgers yet.</div></div>`}
    </div>

    <div class="section-title">By Category</div>
    <div class="row-list">
      ${cats.length? cats.map(([name,v])=>`
        <div class="kv-row" style="background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px;">
          <div class="k">${escapeHtml(name)}</div>
          <div class="v">In ${fmtAmt(v.in)} · Out ${fmtAmt(v.out)}</div>
        </div>`).join('') : `<div class="empty-state"><div class="em-s">No data for this filter.</div></div>`}
    </div>

    <div class="section-title">Export</div>
    <div style="padding:0 18px; display:flex; gap:10px;">
      <button class="btn btn-outline" onclick="exportCSV()">${ICONS.csv.replace('<svg','<svg style="width:16px;height:16px; margin-right:6px; vertical-align:-3px;"')}CSV</button>
      <button class="btn btn-primary" onclick="exportPDF()">${ICONS.pdf.replace('<svg','<svg style="width:16px;height:16px; margin-right:6px; vertical-align:-3px;"')}PDF Report</button>
    </div>
  `;
}

function getFilteredReportTxns(){
  const biz = activeBusiness();
  let txns = bizTxns(biz.id);
  if(UI.reportLedgerId && UI.reportLedgerId!=='all') txns = txns.filter(t=>t.ledgerId===UI.reportLedgerId);
  if(UI.reportFrom) txns = txns.filter(t=> t.date >= UI.reportFrom);
  if(UI.reportTo) txns = txns.filter(t=> t.date <= UI.reportTo);
  return txns.slice().sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}
function exportCSV(){
  const biz = activeBusiness();
  const txns = getFilteredReportTxns();
  let csv = 'Date,Time,Ledger,Type,Category,Party,Remark,Amount\n';
  txns.forEach(t=>{
    const l = ledgerById(t.ledgerId); const p = t.partyId?partyById(t.partyId):null;
    const row = [t.date, t.time||'', l?l.name:'', t.type==='in'?'Cash In':'Cash Out', t.category||'', p?p.name:'', (t.remark||'').replace(/,/g,';'), t.amount];
    csv += row.map(f=>`"${String(f).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${biz.name.replace(/\s+/g,'_')}_report.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV exported');
}
function exportPDF(){
  try{
    const { jsPDF } = window.jspdf;
    const biz = activeBusiness();
    const doc = new jsPDF();
    const txns = getFilteredReportTxns();
    const cashIn = txns.filter(t=>t.type==='in').reduce((s,t)=>s+t.amount,0);
    const cashOut = txns.filter(t=>t.type==='out').reduce((s,t)=>s+t.amount,0);

    doc.setFontSize(16); doc.text(biz.name, 14, 18);
    doc.setFontSize(10); doc.setTextColor(100);
    doc.text(`${biz.owner||''}  |  ${biz.email||''}`, 14, 25);
    doc.text(`${biz.address||''}`, 14, 30);
    doc.setTextColor(0);
    doc.setFontSize(12); doc.text('Financial Report', 14, 40);
    doc.setFontSize(10);
    doc.text(`Period: ${UI.reportFrom||'All time'} to ${UI.reportTo||'Present'}`, 14, 46);
    doc.text(`Total Cash-In: ${fmtAmt(cashIn)}   Total Cash-Out: ${fmtAmt(cashOut)}   Net: ${fmtAmt(cashIn-cashOut)}`, 14, 52);

    const rows = txns.map(t=>{
      const l = ledgerById(t.ledgerId); const p = t.partyId?partyById(t.partyId):null;
      return [t.date, l?l.name:'', t.type==='in'?'Cash In':'Cash Out', t.category||'', p?p.name:'', t.remark||'', fmtAmt(t.amount)];
    });
    doc.autoTable({
      startY:58,
      head:[['Date','Ledger','Type','Category','Party','Remark','Amount']],
      body: rows,
      styles:{fontSize:8},
      headStyles:{fillColor:[91,141,255]},
    });
    doc.save(`${biz.name.replace(/\s+/g,'_')}_report.pdf`);
    showToast('PDF exported');
  }catch(e){
    console.error(e);
    showToast('PDF export failed — try CSV instead');
  }
}

/* ============================= MODAL / SHEET ENGINE ============================= */
function openSheet(html, opts){
  opts = opts||{};
  const wrap = document.createElement('div');
  wrap.className = 'overlay' + (opts.center?' center':'');
  wrap.id = 'activeOverlay';
  wrap.onclick = (e)=>{ if(e.target===wrap) closeSheet(); };
  wrap.innerHTML = `<div class="sheet">${html}</div>`;
  document.getElementById('app').appendChild(wrap);
}
function closeSheet(){
  const el = document.getElementById('activeOverlay');
  if(el) el.remove();
}
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('app').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

function businessFormHtml(biz){
  const isEdit = !!biz;
  biz = biz || {name:'',domain:'',owner:'',phones:[''],email:'',address:''};
  const phones = (biz.phones&&biz.phones.length? biz.phones : ['']);
  return `

      <div class="field"><label>Email</label><input type="email" id="f_email" value="${escapeHtml(biz.email)}" placeholder="name@business.com"></div>
      <div class="field"><label>Address / Location</label><textarea id="f_address" placeholder="City, Country">${escapeHtml(biz.address)}</textarea></div>
      <button class="btn btn-primary" onclick="saveBusiness(${isEdit?`'${biz.id}'`:'null'})">${isEdit?'Save Changes':'Create Business'}</button>
    </div>`;
}
function saveBusiness(id){
  const name = document.getElementById('f_name').value.trim();
  if(!name){ showToast('Business name is required'); return; }
  const domain = document.getElementById('f_domain').value.trim();
  const owner = document.getElementById('f_owner').value.trim();
  const phones = document.getElementById('f_phones').value.split(',').map(s=>s.trim()).filter(Boolean);
  const email = document.getElementById('f_email').value.trim();
  const address = document.getElementById('f_address').value.trim();
  if(id){
    const b = DB.businesses.find(x=>x.id===id);
    Object.assign(b, {name,domain,owner,phones,email,address});
    showToast('Business updated');
  } else {
    const nb = {id:uid('biz'), name,domain,owner,phones,email,address, createdAt:Date.now()};
    DB.businesses.push(nb);
    DB.activeBusinessId = nb.id;
    showToast('Business created');
  }
  save(); closeSheet(); render();
}
function confirmDeleteBusiness(id){
  const b = DB.businesses.find(x=>x.id===id);
  const html = `
    <div class="sheet-head"><div class="sheet-title">Delete Business</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6;">This will permanently delete <strong style="color:var(--text)">${escapeHtml(b.name)}</strong> along with all its ledgers, parties and transactions. This cannot be undone.</p>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteBusiness('${id}')">Delete</button>
      </div>
    </div>`;
  openSheet(html, {center:true});
}
function deleteBusiness(id){
  DB.businesses = DB.businesses.filter(b=>b.id!==id);
  DB.ledgers = DB.ledgers.filter(l=>l.businessId!==id);
  DB.transactions = DB.transactions.filter(t=>t.businessId!==id);
  DB.parties = DB.parties.filter(p=>p.businessId!==id);
  DB.partyTxns = DB.partyTxns.filter(p=>p.businessId!==id);
  if(DB.activeBusinessId===id) DB.activeBusinessId = DB.businesses[0] ? DB.businesses[0].id : null;
  if(!DB.businesses.length){
    // never allow zero businesses — reseed a blank one
    const nb = {id:uid('biz'), name:'My Business', domain:'', owner:'', phones:[], email:'', address:'', createdAt:Date.now()};
    DB.businesses.push(nb); DB.activeBusinessId = nb.id;
  }
  save(); closeSheet(); render(); showToast('Business deleted');
}

  return `
    <div class="sheet-head"><div class="sheet-title">${isEdit?'Edit Ledger':'New Ledger'}</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <div class="field"><label>Ledger Name *</label><input type="text" id="f_lname" value="${escapeHtml(ledger.name)}" placeholder="e.g. Cloth Purchase"></div>
      <div class="field"><label>Description (optional)</label><input type="text" id="f_lnote" value="${escapeHtml(ledger.note)}" placeholder="e.g. Garment business purchases"></div>
      <div class="field"><label>Icon</label>
        <div class="chip-grid" style="grid-template-columns:repeat(5,1fr);">
          ${icons.map(ic=>`<div class="chip ${ledger.icon===ic?'active':''}" data-icon="${ic}" onclick="pickLedgerIcon(this,'${ic}')"><span class="ci">${ic}</span></div>`).join('')}
        </div>
      </div>
      <input type="hidden" id="f_licon" value="${ledger.icon}">
      <button class="btn btn-primary" onclick="saveLedger(${isEdit?`'${ledger.id}'`:'null'})">${isEdit?'Save Changes':'Create Ledger'}</button>
    </div>`;
}
function pickLedgerIcon(el, ic){
  document.querySelectorAll('.chip[data-icon]').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('f_licon').value = ic;
}
function saveLedger(id){
  const name = document.getElementById('f_lname').value.trim();
  if(!name){ showToast('Ledger name is required'); return; }
  const note = document.getElementById('f_lnote').value.trim();
  const icon = document.getElementById('f_licon').value || '📒';
  if(id){
    Object.assign(ledgerById(id), {name, note, icon});
    showToast('Ledger updated');
  } else {
    const nl = {id:uid('ldg'), businessId: activeBusiness().id, name, note, icon, createdAt:Date.now()};
    DB.ledgers.push(nl);
    UI.ledgerFilter = nl.id;
    showToast('Ledger created');
  }
  save(); closeSheet(); render();
}
function confirmDeleteLedger(id){
  const l = ledgerById(id);
  const count = ledgerTxns(id).length;
  const html = `
    <div class="sheet-head"><div class="sheet-title">Delete Ledger</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6;">Delete <strong style="color:var(--text)">${escapeHtml(l.name)}</strong>${count?` and its ${count} transaction(s)`:''}? This cannot be undone.</p>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="closeSheet()">Cancel</button>
        <button class="btn btn-danger" onclick="deleteLedger('${id}')">Delete</button>
      </div>
    </div>`;
  openSheet(html, {center:true});
}
function deleteLedger(id){
  DB.transactions = DB.transactions.filter(t=>t.ledgerId!==id);
  DB.ledgers = DB.ledgers.filter(l=>l.id!==id);
  if(UI.ledgerFilter===id) UI.ledgerFilter='all';
  save(); closeSheet(); render(); showToast('Ledger deleted');
}

/* ============================= TRANSACTIONS ============================= */
function openAddTransaction(){
  const biz = activeBusiness();
  const ledgers = bizLedgers(biz.id);
  if(!ledgers.length){ showToast('Create a ledger first'); return; }
  const html = `
    <div class="sheet-head"><div class="sheet-title">New Entry</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <div class="field"><label>Ledger</label>
        <select id="f_tledger">${ledgers.map(l=>`<option value="${l.id}" ${l.id===UI.ledgerFilter?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Type</label>
        <select id="f_ttype"><option value="in">Cash In</option><option value="out">Cash Out</option></select>
      </div>
      <div class="field"><label>Amount *</label><input type="number" id="f_tamount" placeholder="0" inputmode="numeric"></div>
      <div class="field"><label>Date</label><input type="date" id="f_tdate" value="${todayStr()}"></div>
      <div class="field"><label>Category</label><input type="text" id="f_tcategory" placeholder="e.g. Purchase, Sales, Wages"></div>
      <div class="field"><label>Remark (optional)</label><input type="text" id="f_tremark" placeholder="Notes about this entry"></div>
      <button class="btn btn-primary" onclick="saveTransaction(null)">Add Entry</button>
    </div>`;
  openSheet(html);
}
function saveTransaction(id){
  const ledgerId = document.getElementById('f_tledger').value;
  const type = document.getElementById('f_ttype').value;
  const amount = parseFloat(document.getElementById('f_tamount').value);
  if(!amount || amount<=0){ showToast('Enter a valid amount'); return; }
  const date = document.getElementById('f_tdate').value || todayStr();
  const category = document.getElementById('f_tcategory').value.trim() || (type==='in'?'Sales':'Purchase');
  const remark = document.getElementById('f_tremark').value.trim();
  const biz = activeBusiness();
  if(id){
    const t = DB.transactions.find(x=>x.id===id);
    Object.assign(t, {ledgerId, type, amount, date, category, remark});
    showToast('Entry updated');
  } else {
    DB.transactions.push({id:uid('txn'), businessId:biz.id, ledgerId, type, amount, date, time:nowTimeStr(), category, remark, createdAt:Date.now()});
    showToast('Entry added');
  }
  save(); closeSheet(); render();
}
function openTxnDetail(id){
  const t = DB.transactions.find(x=>x.id===id);
  if(!t) return;
  const ledger = ledgerById(t.ledgerId);
  const party = t.partyId ? partyById(t.partyId) : null;
  const html = `
    <div class="sheet-head"><div class="sheet-title">Entry Details</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="font-family:var(--font-display); font-weight:800; font-size:28px; color:${t.type==='in'?'var(--green)':'var(--red)'}">${t.type==='out'?'-':'+'}${fmtAmt(t.amount)}</div>
        <div class="txn-meta">${t.type==='in'?'Cash In':'Cash Out'}</div>
      </div>
      <div style="background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:6px 14px;">
        <div class="kv-row"><div class="k">Ledger</div><div class="v">${escapeHtml(ledger?ledger.name:'—')}</div></div>
        <div class="kv-row"><div class="k">Date</div><div class="v">${fmtDate(t.date)}</div></div>
        <div class="kv-row"><div class="k">Time</div><div class="v">${escapeHtml(t.time||'—')}</div></div>
        <div class="kv-row"><div class="k">Category</div><div class="v">${escapeHtml(t.category||'—')}</div></div>
        <div class="kv-row"><div class="k">Party</div><div class="v">${escapeHtml(party?party.name:'—')}</div></div>
        <div class="kv-row"><div class="k">Remark</div><div class="v">${escapeHtml(t.remark||'—')}</div></div>
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-outline" onclick="closeSheet()">Close</button>
        <button class="btn btn-danger" onclick="deleteTxn('${t.id}')">Delete</button>
      </div>
    </div>`;
  openSheet(html, {center:true});
}
function deleteTxn(id){
  DB.transactions = DB.transactions.filter(t=>t.id!==id);
  save(); closeSheet(); render(); showToast('Entry deleted');
}

/* ============================= PARTIES ============================= */
function openAddParty(){
  const html = `
    <div class="sheet-head"><div class="sheet-title">Add Party</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <div class="field"><label>Name *</label><input type="text" id="f_pname" placeholder="e.g. Rahat Fashion House"></div>
      <div class="field"><label>Type</label>
        <select id="f_ptype"><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="contractor">Contractor</option></select>
      </div>
      <div class="field"><label>Phone (optional)</label><input type="text" id="f_pphone" placeholder="+91..."></div>
      <button class="btn btn-primary" onclick="saveParty(null)">Add Party</button>
    </div>`;
  openSheet(html);
}
function saveParty(id){
  const name = document.getElementById('f_pname').value.trim();
  if(!name){ showToast('Party name is required'); return; }
  const type = document.getElementById('f_ptype').value;
  const phone = document.getElementById('f_pphone').value.trim();
  const biz = activeBusiness();
  if(id){
    Object.assign(partyById(id), {name, type, phone});
    showToast('Party updated');
  } else {
    DB.parties.push({id:uid('party'), businessId:biz.id, name, type, phone, createdAt:Date.now()});
    showToast('Party added');
  }
  save(); closeSheet(); render();
}
function openPartyDetail(id){
  const p = partyById(id);
  if(!p) return;
  const bal = partyBalance(p.id);
  const txns = DB.partyTxns.filter(t=>t.partyId===id).sort((a,b)=> (b.date||'').localeCompare(a.date||'') || b.createdAt-a.createdAt);
  const html = `
    <div class="sheet-head"><div class="sheet-title">${escapeHtml(p.name)}</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <div style="text-align:center; margin-bottom:16px;">
        <div style="font-family:var(--font-display); font-weight:800; font-size:24px; color:${bal>=0?'var(--green)':'var(--red)'}">${fmtAmt(Math.abs(bal))}</div>
        <div class="txn-meta">${bal>=0?'You Get':'You Give'}</div>
      </div>
      <div style="background:var(--card); border:1px solid var(--border-soft); border-radius:var(--radius-md); padding:6px 14px; margin-bottom:14px;">
        <div class="kv-row"><div class="k">Type</div><div class="v">${escapeHtml(p.type)}</div></div>
        <div class="kv-row"><div class="k">Phone</div><div class="v">${escapeHtml(p.phone||'—')}</div></div>
      </div>
      <div class="section-title" style="margin-top:8px;">Transactions</div>
      <div class="row-list">
        ${txns.length? txns.map(t=>`
          <div class="txn-row" style="cursor:default;">
            <div class="txn-dot ${t.type==='you_got'?'in':'out'}">${t.type==='you_got'?ICONS.down.replace('<svg','<svg style="width:17px;height:17px; transform:rotate(90deg) scaleX(-1);"'):ICONS.up.replace('<svg','<svg style="width:17px;height:17px;"')}</div>
            <div class="txn-info"><div class="txn-name">${escapeHtml(t.remark||'Entry')}</div><div class="txn-meta">${fmtDate(t.date)}</div></div>
            <div class="txn-amt"><div class="amt ${t.type==='you_got'?'in':'out'}">${t.type==='you_got'?'+':'-'}${fmtAmt(t.amount)}</div><div class="lbl">${t.type==='you_got'?'You Got':'You Gave'}</div></div>
          </div>`).join('') : `<div class="empty-state"><div class="em-s">No transactions yet</div></div>`}
      </div>
      <div class="btn-row" style="margin-top:14px;">
        <button class="btn btn-outline" onclick="closeSheet()">Close</button>
        <button class="btn btn-danger" onclick="deleteParty('${p.id}')">Delete Party</button>
      </div>
    </div>`;
  openSheet(html, {center:true});
}
function deleteParty(id){
  DB.parties = DB.parties.filter(p=>p.id!==id);
  DB.partyTxns = DB.partyTxns.filter(t=>t.partyId!==id);
  save(); closeSheet(); render(); showToast('Party deleted');
}

/* ============================= PIN LOCK ============================= */
function openSetPin(){
  const html = `
    <div class="sheet-head"><div class="sheet-title">Set App PIN</div><div class="icon-btn" onclick="closeSheet()">✕</div></div>
    <div class="sheet-body">
      <p style="color:var(--text-dim); font-size:14px; line-height:1.6;">Enter a 4-digit PIN to protect your data. You'll need this PIN each time you open the app.</p>
      <div class="field"><label>4-Digit PIN *</label><input type="password" id="f_pin" maxlength="4" inputmode="numeric" placeholder="••••"></div>
      <button class="btn btn-primary" onclick="savePin()">Set PIN</button>
    </div>`;
  openSheet(html, {center:true});
}
function savePin(){
  const pin = document.getElementById('f_pin').value.trim();
  if(!/^\d{4}$/.test(pin)){ showToast('PIN must be 4 digits'); return; }
  DB.settings.pinLock = true;
  DB.settings.pin = pin;
  save(); closeSheet(); render(); showToast('App lock enabled');
}

/* ============================= BOOTSTRAP ============================= */
if(!window.storage){
  window.storage = {
    get: async (key) => { try { const v = localStorage.getItem(key); return v ? {value: v} : null; } catch(e){ return null; } },
    set: async (key, value) => { try { localStorage.setItem(key, value); } catch(e){} }
  };
}
(async function init(){
  await loadData();
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('loader').style.display = 'none';
  render();
})();
</script>
</body>
</html>
